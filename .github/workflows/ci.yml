name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: node --check main.js

      - name: Verify static entrypoints
        run: |
          test -s index.html
          test -s styles.css
          grep -Fq 'href="styles.css"' index.html
          grep -Fq 'src="main.js"' index.html
